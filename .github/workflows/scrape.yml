name: Auto Sync Poolvilla

on:
  schedule:
    # ทุก 30 นาที (GitHub แนะนำไม่ต่ำกว่า 5 นาที แต่ไม่ควรรันถี่เกินไป)
    - cron: '*/30 * * * *'
  workflow_dispatch: # กดรันเองได้ในหน้า GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Sync via Vercel API
        run: |
          echo "🔄 กำลัง trigger sync ผ่าน API..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "https://pool-villaptong.vercel.app/api/auto-sync?secret=${{ secrets.CRON_SECRET }}" \
            -H "Accept: application/json" \
            --max-time 30)
          
          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Sync triggered สำเร็จ!"
          else
            echo "⚠️ API ตอบกลับ HTTP $HTTP_CODE — อาจมีปัญหา แต่ workflow จะไม่ fail"
          fi
